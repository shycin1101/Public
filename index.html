ction:"5.2",when:'当区分"债券池"与"挂账"时',key:!0,then:"**债券池只记档位省下的额度（满额计划 − 应投）**；取整残余（挂账）**不属于债券池**，单独记账、顺延到下期凑整手（规则 13.2）。",note:'两者性质完全不同：债券池是"主动决定不投的钱"，要等触发条件才部署；挂账是"想投但买不了整手的钱"，下期就该投出去。混在一起会让池子虚高，误判可以动用的弹药。'},{num:"33",chapter:"5",section:"5.2",when:"当忘记某笔钱属于谁时",then:'记为"无主·按新钱处理"，**不追溯**。'},{num:"34",chapter:"6",section:"",when:"默认情况",then:'**永不卖出**。例外只有三个：规则 36 的阈值、规则 45–48 的破位离场、规则 52–53 的止损熔断。每月新增额优先补"低于目标"的资产。',note:'34 管的是"估值合理区间的常态持有"；破位与止损管的是"趋势已破坏的异常态"。分层，不冲突。'},{num:"35",chapter:"6",section:"",when:"当需要用新增资金纠正比例时",then:"优先给偏离最大的低配资产，零卖出成本。"},{num:"36",chapter:"6",section:"",when:"当某类资产占比 < 目标的一半，或某一类合计 > 75% 时",then:"卖出超配部分拉回目标。"},{num:"37",chapter:"6",section:"",when:'当有"消息面／风声"想调整时',then:"**不动**。再平衡只在每年 12 月末按阈值执行。"},{num:"38",chapter:"7",section:"7.1",when:"当判断某标的去留时",then:'只问一句：**"如果今天手里有这笔现金，我会买入它吗？"** 不会 → 卖。'},{num:"39",chapter:"7",section:"7.1",when:"当两只基金前十大持仓重复 > 3 家时",then:"视为同一敞口，合并为一只。"},{num:"40",chapter:"7",section:"7.1",when:"当某标的亏损时",then:'**盈亏不参与决策**。"等回本"是锚定效应——市场不知道你的成本价。'},{num:"41",chapter:"7",section:"7.1",when:"当某标的盈利时",then:"同样按规则 38 判断。盈利既不是卖出的理由，也不是持有的理由。"},{num:"45",chapter:"7",section:"7.2",when:"当第一档触发时（双锚任一，先到先执行）",key:!0,then:"**全程相对仓位制**：每次卖出量 = 触发时剩余仓位 × 该档比例，卖出后**先更新剩余仓位**，下一档以更新后的剩余为基数——不用初始仓位的固定份额。**锚 B（趋势）**：检视日收盘跌破 20 日线（回撤 <15%）→ 卖剩余仓位的 **20%**。**锚 A（回撤）**：自近期高点回撤 ≥15% → 破位已先行：卖剩余仓位的 **25%**；破位未触发：卖剩余仓位的 **30%**。任一锚触发即**停加**（档位转暂停）。第一档只执行一次：先到的锚决定力度，后到的锚不追加（回撤 ≥15% 后破位不再单独触发卖出）。卖出当日进债券池并按规则 32 记账。",note:`锚重锚轻的依据：阴跌时均线钝化、回撤先响，跌势已深，第一档卖 30%；快跌时 20 日线先响而回撤尚浅，可能只是假摔，只卖 20% 留证伪空间——下次检视站回 20 日线即按规则 48 假摔回补。
判定挂 8/22 日检视：锚 A 用 dd 字段（回撤基准 = 近期高点），锚 B 看检视日收盘与 20 日线（盘中破线不算，等检视日收盘定）。锚 B 再次触发须先经历"检视日站回 20 日线"，否则均线缠绕期会被连续洗。震荡判定（规则 49）成立期间锚 B 暂停，走箱体规则。
为什么改相对制：固定份额卖出与市值脱钩，深跌后单笔占比失真；相对制卖出金额随剩余仓位平滑收缩，且两条路径能用同一套逻辑校验收敛。第一档执行后的剩余：破位先行 80%，回撤先行 70%。`},{num:"46",chapter:"7",section:"7.2",when:"当回撤 ≥20% 时；当回撤 ≥25% 时",key:!0,then:"**回撤 ≥20%：卖出剩余仓位的 1/3**（破位先行路径；破位未触发路径为 **2/7**）。**回撤 ≥25%：卖出剩余仓位的 1/8**（破位先行路径；破位未触发路径为 **30%**）。每次卖出后先更新剩余仓位，下一档以更新后的剩余为基数。单次检视跨多档时**各档依次补执行**（先卖先档、基数逐档更新）。档位间不强制隔月——股灾连档执行，慢熊逐档执行。卖出当日进债券池并按规则 32 记账。",note:`基数是上一档执行后的剩余仓位。两条完整路径（剩余仓位序列）：
破位先行（快跌转真崩）：100 → 80（破位卖 20%）→ 60（15% 卖 25%）→ 40（20% 卖 1/3）→ **35**（25% 卖 1/8）
破位未触发（阴跌）：100 → 70（15% 卖 30%）→ 50（20% 卖 2/7）→ **35**（25% 卖 30%）
两路径统一收敛 35%，不再分叉。
永不清零的依据：深跌后期望收益上升（与 5.2 同源），右侧买回价必然高于离场价——分档是不预测顶的唯一解。
锚 B 的明确价格：A 股科技类每年破 20 日线 2–3 次属常态，每次假摔往返（卖在破线日、买在收回日）约亏卖出量 × 2–4% 差价 ≈ 总仓 0.4–0.8%——这是保险费，买的是真破位时的提前离场。`},{num:"47",chapter:"7",section:"7.2",when:"当四只高波动合计破位（真·股灾）时",then:"进攻仓位整体收敛到**约 1/3**（按市值算），卖出部分进债券池。",note:`保留比例不是经验值，是风险预算倒推：承受线 25% = x×50%（进攻历史回撤）+ 0.30×20%（防守）→ x ≈ 38% ≈ 1/3。
锚定的是"熊市里夜里睡得着、拿得住"，不是预测底在哪。承受线换成 20% → 保留 1/4；30% → 保留 1/2。改承受线就重算，别拍脑袋。
1/3 是收敛**上限**不是补足目标：若四只已各自走完 45/46 的档位（合计留仓约 35%），本条不再追加卖出。`},{num:"48",chapter:"7",section:"7.2",when:"当破位离场后判断反转是否确认时（两条路，任一即触发）",key:!0,then:"**磨底路（常态）**：连续两次检视低点抬高（不再创新低）且收盘站回 20 日线且分位 <30%。**V 型路（例外）**：自区间最低收盘价反弹 ≥10% 且收盘站回 20 日线——幅度换时间，不等两次检视。触发当日从债券池**买回卖出款的 1/2**；剩余 1/2 每 30 天检视：较上次买回价再跌 ≥5% → 提前买剩余的一半；**60 天到期 → 不看价格买完**（时间止损）。第一档触发后，每次检视顺手记录该标的**区间最低收盘价**（V 型路与规则 48.3 的基准）。**假摔回补**（独立）：锚 B 减仓后下次检视站回 20 日线 → 买回第一档卖出的量，本次序列作废重置。",note:`磨底路要"两次低点抬高"的依据：单次反弹多半是超跌反弹而非反转（七阶段模型：超跌反弹之后还有真空期，"不排除新低"），低点抬高才说明卖压衰竭。代价是牺牲约 5–10% 的底部涨幅，换假信号率大降。
V 型路的依据：2024-09 六个交易日 +30%，月频检视根本看不到两次低点抬高；熊市单日反抽通常 3–6%，持续两周 +10% 需要真实增量买盘，噪音伪造不出来——幅度是时间的对价。
60 天时间止损给"踏空"装止损（同源规则 31）。期望差：低位买回期望 ≈8% > 债券 2% + 4% 安全垫。永久离场 = 主动放弃正期望机会，禁止。
哲学：这套确认不是预测——所有锚点（低点、幅度、均线、分位）都是事后可复算的数。市场没有预测，只有对策。`},{num:"48.1",chapter:"7",section:"7.2",when:"当破位离场序列进行中（已触发卖出、尚未完成回补）时",key:!0,then:"**5.2 全章冻结**：L1–L4 不动池、不恢复档位，规则 31 的强制部署一并暂停。买回只走规则 48 的双确认——同一轮回撤里**先卖完、后买回**，方向不能打架。序列作废（回补完成）后本条自动解除。",note:'冲突实例：回撤 20–25% 时，规则 46 在卖剩余仓位，5.2 的 L2 却要动池买入——同一周一手卖一手买，费用白扔。5.2 是"没有破位的普通低估加码"，破位期间让位给离场序列；剩余 35% 是留仓底仓（永不清零），池子的钱等双确认再进，不接飞刀。'},{num:"48.2",chapter:"7",section:"7.2",when:"当反转确认触发后、买回途中价格再创新低时（反转失败）",then:"**未买回部分立即暂停**；已买部分**不止损、拿着不动**（买在分位 <30%，是长期筹码，适用规则 34，不走规则 52 止损）。解冻条件：收盘重新站回 20 日线**且自新低点反弹 ≥10%** → 继续原节奏。",note:`熊市反抽是常态：2015–2016、2022 年都出现过站回 20 日线后再创新低的假反转。1/2 先埋、1/2 等更硬确认的结构：代价是失败时 1/2 浮亏数月，收益是全部资金不接在半山腰。
解冻比首次触发更硬（必须见幅度 ≥10%，不能用磨底路）：同一区间反复触发会把资金磨成分批接刀。
已买不止损的依据：止损（规则 52）是震荡仓防接刀的规则；深跌筹码期望为正，止损会把长期筹码变成震荡仓的牺牲品。`},{num:"48.3",chapter:"7",section:"7.2",when:"当自区间最低收盘价反弹 ≥20%，或检视日收盘站上 60 日线时（牛市确认锚，任一）",key:!0,then:"**未买回部分立即全部买完**（不等 30/60 天节奏）。离场序列随之完全作废：回撤基准换锚新周期、档位按分位恢复、45/46/48.2 全部计数清零，回到规则 34 常态。",note:`+20% 是技术性牛市的通用定义；60 日线 ≈ 近一季度平均成本线，站上 = 该期间买入者整体解套、抛压结构反转。急涨先触发 20%，缓涨先触发 60 日线——两个锚都无法被单日噪音伪造，也不需要成交量、情绪等高频数据。
牛市确认后还留着钱等回调 = 用"预测顶"废掉"不预测"：该回来的钱必须回来。
